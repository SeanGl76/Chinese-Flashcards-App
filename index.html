<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Flashcards SRS</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Chinese Learner <span style="font-size:0.8em">🇨🇳</span></h1>
        </header>

        <div id="main-menu" class="fade-in">
            <div class="group-section">
                <label>📚 Select Groups to Study:</label>
                <div id="group-filters" class="group-grid"></div>
            </div>

            <div class="daily-goal-section">
                <label>📝 Daily Word Goal:</label>
                <div class="goal-selector">
                    <button class="goal-btn active" onclick="setLimit(10)">10</button>
                    <button class="goal-btn" onclick="setLimit(20)">20</button>
                    <button class="goal-btn" onclick="setLimit(30)">30</button>
                    <button class="goal-btn" onclick="setLimit(50)">50</button>
                </div>
                <button class="btn mode-btn large" onclick="startDailySession()">
                    <span class="icon">🚀</span> Start Daily Review
                </button>
            </div>

            <button class="btn secondary outline full-width" onclick="startPractice('sentences')">
                <span class="icon">🗣️</span> Practice Random Sentences
            </button>
            
            <div class="secondary-menu">
                <button class="btn secondary" onclick="showWordBank()">📖 Word Bank</button>
                <button class="btn secondary" onclick="showAddWordMenu()">➕ Add Word</button>
                <button class="btn secondary" onclick="triggerFileUpload()" style="background:#e8f8f5; color:#16a085;">📊 Import Excel</button>
                <button class="btn secondary outline" onclick="showSyncMenu()">☁️ Sync</button>
            </div>
            
            <input type="file" id="file-upload" accept=".xlsx, .xls" style="display:none" onchange="handleExcelUpload(event)">
        </div>

        <div id="add-word-menu" class="hidden fade-in">
            <h2>Add New Word</h2>
            <div class="input-group">
                <label>Group Name</label>
                <input type="text" id="input-group" list="group-suggestions" placeholder="e.g. Lesson 10">
                <datalist id="group-suggestions"></datalist>

                <label>Hanzi (Chinese)</label>
                <input type="text" id="input-hanzi" placeholder="e.g. 水">
                <label>Pinyin</label>
                <input type="text" id="input-pinyin" placeholder="e.g. shuǐ">
                <label>English</label>
                <input type="text" id="input-english" placeholder="e.g. Water">
            </div>
            <div class="action-buttons">
                <button class="btn primary" onclick="saveNewWord()">Save Word</button>
                <button class="btn ghost" onclick="returnToMenu()">Cancel</button>
            </div>
        </div>

        <div id="word-list-section" class="hidden fade-in">
            <div class="header-row">
                <h2 id="wb-title">Word Bank</h2>
                <button class="btn sm-ghost" onclick="returnToMenu()">✕ Close</button>
            </div>
            
            <div id="wb-group-view">
                <p class="desc">Select a folder to view words:</p>
                <div id="wb-group-grid" class="folder-grid"></div>
            </div>

            <div id="wb-detail-view" class="hidden">
                <div class="sub-controls">
                    <button class="btn sm-ghost" onclick="backToFolders()">← Back to Folders</button>
                    <input type="text" id="search-bar" placeholder="🔍 Search in this group..." onkeyup="filterTable()">
                </div>
                
                <div class="table-container">
                    <table class="word-table">
                        <thead>
                            <tr>
                                <th>Hanzi</th>
                                <th>Pinyin</th>
                                <th>English</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="word-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="sync-menu" class="hidden fade-in">
            <h2>Backup & Sync</h2>
            <p class="desc">1. Tap "Get Data" to generate a code.<br>2. Copy the code and send it to your other device.</p>
            <textarea id="sync-data-box" rows="5" placeholder="Tap 'Get Data' to see your code..."></textarea>
            <div class="action-buttons">
                <button class="btn primary" onclick="exportData()">⬇️ Get Data</button>
                <button class="btn secondary" onclick="importData()">⬆️ Load Data</button>
            </div>
            <button class="btn ghost full-width" onclick="returnToMenu()">Back</button>
        </div>

        <div id="game-area" class="hidden fade-in">
            <div class="progress-bar">
                <span id="progress-text">Word 1 of 10</span>
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="card-container">
                <div class="card" onclick="flipCard()">
                    <div class="card-inner">
                        <div class="card-front">
                            <button class="audio-btn" onclick="playAudio(event)">🔊</button>
                            <h2 id="display-hanzi">汉字</h2>
                            <p class="hint">Tap to flip</p>
                        </div>
                        <div class="card-back">
                            <button class="audio-btn" onclick="playAudio(event)">🔊</button>
                            <h3 id="display-pinyin">Pinyin</h3>
                            <p id="display-english">English Meaning</p>
                            <span id="display-group" class="group-badge">Group Name</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="sentence-controls" class="controls hidden">
                <button class="btn ghost" onclick="returnToMenu()">Exit</button>
                <button class="btn primary large-action" onclick="nextCard()">Next &rarr;</button>
            </div>

            <div id="srs-controls" class="srs-grid hidden">
                <button class="srs-btn again" onclick="handleSRS('again')">
                    <span class="lbl">Again</span>
                    <span class="time">Now</span>
                </button>
                <button class="srs-btn hard" onclick="handleSRS('hard')">
                    <span class="lbl">Weak</span>
                    <span class="time">1d</span>
                </button>
                <button class="srs-btn good" onclick="handleSRS('good')">
                    <span class="lbl">Strong</span>
                    <span class="time">7d</span>
                </button>
                <button class="srs-btn easy" onclick="handleSRS('easy')">
                    <span class="lbl">Bury</span>
                    <span class="time">30d</span>
                </button>
            </div>
            
            <div id="srs-exit" class="controls hidden" style="justify-content: center; margin-top:10px;">
                 <button class="btn ghost" onclick="returnToMenu()">Exit Session</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
